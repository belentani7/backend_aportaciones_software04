name: harmonia

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-harmonia}
      MYSQL_USER: ${MYSQL_USER:-harmonia}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-harmonia_local_dev_password_2026}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-harmonia_root_local_dev_password_2026}
    command: ["mysqld", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - mysql_data:/var/lib/mysql
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  migrate:
    build:
      context: .
      target: runner
    restart: "no"
    command: ["pnpm", "drizzle-kit", "migrate"]
    environment: &backend_env
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: mysql://${MYSQL_USER:-harmonia}:${MYSQL_PASSWORD:-harmonia_local_dev_password_2026}@mysql:3306/${MYSQL_DATABASE:-harmonia}
      JWT_SECRET: ${JWT_SECRET:-harmonia_local_jwt_secret_change_before_public_exposure_2026}
      OWNER_OPEN_ID: ${OWNER_OPEN_ID:-local-owner}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      OAUTH_SERVER_URL: ${OAUTH_SERVER_URL:-}
      BUILT_IN_FORGE_API_URL: ${BUILT_IN_FORGE_API_URL:-}
      BUILT_IN_FORGE_API_KEY: ${BUILT_IN_FORGE_API_KEY:-}
    depends_on:
      mysql:
        condition: service_healthy
    networks: [data]

  api:
    build:
      context: .
      target: production
    restart: unless-stopped
    environment: *backend_env
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "${API_PORT:-3000}:3000"
    networks: [edge, data]
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    build:
      context: .
      target: runner
    restart: unless-stopped
    command: ["pnpm", "worker:local"]
    environment: *backend_env
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "node -e \"process.kill(1, 0)\""]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  edge:
    driver: bridge
  data:
    driver: bridge
    internal: true

volumes:
  mysql_data:
