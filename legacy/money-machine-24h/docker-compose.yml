version: '3.8'

services:
  # PostgreSQL Database - ACID compliant for financial transactions
  db:
    image: postgres:15-alpine
    container_name: money-machine-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-moneyuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-moneypass123}
      POSTGRES_DB: ${POSTGRES_DB:-money_machine}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-moneyuser}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - money-network

  # Redis - For caching and Celery message broker
  redis:
    image: redis:7-alpine
    container_name: money-machine-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - money-network

  # FastAPI Backend
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: money-machine-api
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-moneyuser}:${POSTGRES_PASSWORD:-moneypass123}@db:5432/${POSTGRES_DB:-money_machine}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      DEBUG: ${DEBUG:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
      - ./scripts:/app/scripts
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    networks:
      - money-network
    restart: unless-stopped

  # Celery Worker - Async task processing
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: money-machine-worker
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-moneyuser}:${POSTGRES_PASSWORD:-moneypass123}@db:5432/${POSTGRES_DB:-money_machine}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
    volumes:
      - ./app:/app/app
      - ./scripts:/app/scripts
    depends_on:
      - db
      - redis
    command: celery -A app.tasks.worker worker --loglevel=info
    networks:
      - money-network
    restart: unless-stopped

  # Celery Beat - Scheduled tasks
  beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: money-machine-beat
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-moneyuser}:${POSTGRES_PASSWORD:-moneypass123}@db:5432/${POSTGRES_DB:-money_machine}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./app:/app/app
      - ./scripts:/app/scripts
    depends_on:
      - db
      - redis
    command: celery -A app.tasks.worker beat --loglevel=info
    networks:
      - money-network
    restart: unless-stopped

  # APScheduler Service - 24H autonomous scheduler
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: money-machine-scheduler
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-moneyuser}:${POSTGRES_PASSWORD:-moneypass123}@db:5432/${POSTGRES_DB:-money_machine}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./app:/app/app
      - ./scripts:/app/scripts
    depends_on:
      - db
      - redis
    command: python scripts/run_scheduler.py
    networks:
      - money-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  money-network:
    driver: bridge
