name: Private legacy integrity
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify inventory and source provenance
        run: npm run verify
      - name: Verificación de protocolos
        run: test -f README.md && test -f LICENSE && test -f .gitignore && test -f .github/CODEOWNERS
